<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – AutoCare Smart Vehicle Service</title>
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    body {
      background: linear-gradient(135deg, #0D1B2A 0%, #1565C0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .forgot-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="forgot-card">
    <div class="text-center mb-4">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
        <div class="sidebar-brand-icon">
          <i class="fa-solid fa-car-wrench"></i>
        </div>
        <div class="text-start">
          <div class="brand-font fw-bold fs-4 text-dark lh-1">AutoCare</div>
          <small class="text-secondary" style="font-size: 0.68rem; letter-spacing: 0.06em;">SMART VEHICLE SERVICE</small>
        </div>
      </a>
      <h4 class="fw-bold text-dark mb-1">Reset Password 🔐</h4>
      <p class="text-secondary small">Enter your registered email address to receive a secure password recovery link or OTP.</p>
    </div>

    <form id="forgotForm">
      <div class="mb-4">
        <label class="form-label" for="resetEmail">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
          <input type="email" class="form-control" id="resetEmail" placeholder="e.g. pravin@example.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
        <i class="fa-regular fa-paper-plane me-1"></i> Send Recovery Instructions
      </button>

      <div class="text-center">
        <a href="login.html" class="text-secondary small text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      AutoCareApp.Toast.show('success', 'Reset Link Sent', `Password reset instructions dispatched to ${email}. Check your inbox.`);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1500);
    });
  </script>
</body>
</html>
