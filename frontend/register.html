<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – AutoCare Smart Vehicle Service</title>
  
  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <style>
    body {
      background: linear-gradient(135deg, #0D1B2A 0%, #1565C0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .register-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 680px;
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="text-center mb-4">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
        <div class="sidebar-brand-icon">
          <i class="fa-solid fa-car-wrench"></i>
        </div>
        <div class="text-start">
          <div class="brand-font fw-bold fs-4 text-dark lh-1">AutoCare</div>
          <small class="text-secondary" style="font-size: 0.68rem; letter-spacing: 0.06em;">SMART VEHICLE SERVICE</small>
        </div>
      </a>
      <h3 class="fw-bold text-dark mb-1">Create an AutoCare Account</h3>
      <p class="text-secondary small">Join thousands of smart vehicle owners and authorized workshops.</p>
    </div>

    <!-- Public registration is for car owners only. Admin and Garage accounts are fixed. -->
    <div class="alert alert-info small">Register as a Car Owner. Garage and Admin accounts are managed separately.</div>

    <!-- Registration Form -->
    <form id="registerForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="regFullName">Full Name *</label>
          <input type="text" class="form-control" id="regFullName" placeholder="e.g. Pravin Kumar" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="regEmail">Email Address *</label>
          <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="regPhone">Phone Number *</label>
          <input type="tel" class="form-control" id="regPhone" placeholder="+91 98765 43210" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="regCity">City / Location *</label>
          <input type="text" class="form-control" id="regCity" placeholder="Mumbai, Maharashtra" required>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="regPassword">Password *</label>
          <input type="password" class="form-control" id="regPassword" placeholder="Minimum 8 characters" minlength="8" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
          <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter password" minlength="8" required>
        </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small text-secondary" for="termsCheck">
              I agree to the AutoCare <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>.
            </label>
          </div>
        </div>

        <div class="col-12 mt-4">
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="fa-solid fa-user-plus me-1"></i> Register Account
          </button>
        </div>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top text-secondary small">
      Already have an account? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign In here</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const phone = document.getElementById('regPhone').value.trim();
      const city = document.getElementById('regCity').value.trim();
      const pass = document.getElementById('regPassword').value;
      const cpass = document.getElementById('regConfirmPassword').value;
      const role = 'owner';
      const garageName = ''; 
      if (pass !== cpass) {
        AutoCareApp.Toast.show('danger', 'Password Mismatch', 'Passwords do not match. Please verify.');
        return;
      }
      if (pass.length < 6) {
        AutoCareApp.Toast.show('warning', 'Password too short', 'Use at least 6 characters for your password.');
        return;
      }
      const submitButton = this.querySelector('button[type="submit"]');
      if (submitButton) submitButton.disabled = true;
      try {
        const response = await fetch('../backend/api/auth.php?action=register', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, city, password: pass, role, garageName })
        });
        const result = await response.json();
        if (!response.ok || !result.success || !result.user) {
          AutoCareApp.Toast.show('danger', 'Registration failed', result.error || 'Could not create your account.');
          return;
        }
        const user = result.user;
        localStorage.setItem('AUTOCARE_AUTH_USER_V1', JSON.stringify(user));
        localStorage.removeItem('AUTOCARE_ACCOUNTS_V1');
        AutoCareData.setAuthenticatedUser(user, true);
        AutoCareApp.Toast.show('success', 'Account Created', 'Your account is saved in MySQL. Opening your dashboard...');
        setTimeout(() => { window.location.href = 'owner/dashboard.html'; }, 450);
      } catch (error) {
        AutoCareApp.Toast.show('danger', 'Server connection failed', 'Start Apache and MySQL in XAMPP and import database/schema.sql.');
      } finally {
        if (submitButton) submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
